name: Pilot checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check functions/index.js
          node --check public/app.js
          node --input-type=module --check < public/catalog.js
          node --input-type=module --check < public/accessibility.js
          node --input-type=module --check < public/official-intake.js
          node --input-type=module --check < public/official-staff.js
          node --input-type=module --check < public/official-tracking.js
          node --input-type=module --check < public/institutional.js
          node scripts/prepare-spark.mjs
          node --check < build/spark-release/Codigo.gs
          node --check public/config.js
          node --check < apps-script/Common.gs
          node --check < apps-script/recepcion/Code.gs
          node --check < apps-script/entrega/Code.gs
          node --check < apps-script/spark/SparkAuth.gs
          node --check < apps-script/spark/ReceptionProbe.gs
          node --check public/spark-probe.js
          node --check < apps-script/spark/ReceptionPilot.gs
          node --check < apps-script/spark/UnifiedBackend.gs
          node --check < apps-script/spark/SupabaseBridge.gs
          node --check public/spark-pilot.js
      - name: Package authorized Apps Script update
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-salud-release
          path: build/spark-release/
          if-no-files-found: error
      - name: Unit tests and security contracts
        run: node --test tests/*.test.mjs
      - name: Audit locked dependencies
        run: |
          npm ci --prefix functions --ignore-scripts
          npm --prefix functions audit --omit=dev --audit-level=moderate
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Test citizen and administration flows
        run: |
          python3 -m http.server 8080 --directory public > /tmp/portal.log 2>&1 &
          node tests/browser.mjs
          node tests/institutional-browser.mjs
          node tests/catalog-browser.mjs
          node tests/official-staff-browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-preview
          path: screenshots/
          if-no-files-found: ignore
  firebase-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCLOUD_PROJECT: demo-discapacidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Run authorization and workflow integration tests
        run: npx --yes firebase-tools@15.22.1 emulators:exec --only auth,firestore --project demo-discapacidad 'node --test tests/firebase-emulator.mjs && node tests/spark-catalog-firestore.mjs'
  publish-portal:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static, browser, firebase-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify operational portal and assemble Pages artifact
        run: |
          grep -F 'const demo=false' public/app.js
          mkdir pages
          cp -R public/. pages/
          rm -f pages/spark-probe.html pages/spark-probe.js pages/spark-pilot.html pages/spark-pilot.js pages/pilot.html
          test ! -e public/assets/brand/san-pedro-marca.png
          test -z "$(find public -type f \( -name '*.pem' -o -name '*.key' -o -name '.env*' \))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
