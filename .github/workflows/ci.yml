name: Pilot checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check functions/index.js
          node --check public/app.js
          node --check public/config.js
          node --check < apps-script/Common.gs
          node --check < apps-script/recepcion/Code.gs
          node --check < apps-script/entrega/Code.gs
      - name: Static security contracts
        run: node --test tests/*.test.mjs
