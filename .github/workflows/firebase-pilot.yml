name: Deploy authenticated Firebase pilot
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PILOTO-CERRADO after reviewing Firebase and institutional approvals'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PILOTO-CERRADO'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-pilot
    concurrency:
      group: firebase-pilot
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
      APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
      PILOT_PORTAL_URL: ${{ vars.PILOT_PORTAL_URL }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configuration and static tests
        run: |
          node --test tests/*.test.mjs
          node --check functions/index.js
          node --check public/app.js
          node scripts/configure-pilot.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: tramite-discapacidad
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install dependencies and verify syntax
        run: |
          npm install --prefix functions --ignore-scripts
          npm --prefix functions run check
          npm --prefix functions audit --omit=dev --audit-level=high
      - name: Deploy closed pilot
        run: npx --yes firebase-tools@15.22.1 deploy --only firestore:rules,firestore:indexes,functions,hosting --project tramite-discapacidad --non-interactive
